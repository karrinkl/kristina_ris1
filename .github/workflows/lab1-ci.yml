name: Lab1 CI (.NET 8, Linux + Windows)

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
    defaults:
      run:
        shell: pwsh

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Setup .NET 8 SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.0.x'

      - name: Show .NET info
        run: dotnet --info

      - name: Restore
        run: dotnet restore lab1/CandySales.sln

      - name: Build (warnings are errors)
        run: dotnet build lab1/CandySales.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test lab1/CandySales.sln --configuration Release --no-build --verbosity normal

      - name: Smoke run of the console application
        run: |
          [Console]::OutputEncoding = [System.Text.UTF8Encoding]::new($false)
          $output = "1", "0" | dotnet run --project lab1/src/CandySales/CandySales.csproj --configuration Release --no-build
          $output
          if ($LASTEXITCODE -ne 0) { throw "Приложение завершилось с кодом $LASTEXITCODE" }
          if (-not ($output -match 'Работа завершена')) { throw 'Приложение не дошло до штатного выхода из меню' }
